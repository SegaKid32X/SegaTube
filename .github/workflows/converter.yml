# Builds SegaTube Converter for Windows and macOS (and Linux): the stvenc
# encoder, ffmpeg (from imageio-ffmpeg) and the converter in one app.
# Every push to main replaces the "latest" release: the player ROM
# (release/segatube.32x) and each converter as its build finishes.
name: converter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # a fresh "latest" release at this commit, with the player ROM
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Replace the latest release
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest release/segatube.32x \
            --target "$GITHUB_SHA" --latest \
            --title "SegaTube (latest)" \
            --notes "The player ROM (segatube.32x) and SegaTube Converter for Windows (.exe), Mac (-mac.zip) and Linux (.tar.gz). The converters appear here as their builds finish. Mac: unzip, then right-click the app and choose Open the first time."

  build:
    needs: release
    if: always()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            exe: .exe
            name: SegaTubeConverter-windows
          - os: macos-14                # (macos-latest's queue can be long)
            exe: ""
            name: SegaTubeConverter-macos
          - os: ubuntu-latest
            exe: ""
            name: SegaTubeConverter-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build stvenc
        run: |
          mkdir -p dist-bin
          cc_cmd=cc
          if [ "${{ runner.os }}" = "Windows" ]; then cc_cmd=gcc; fi
          $cc_cmd -O2 -std=gnu11 -Isrc/codec -o dist-bin/stvenc${{ matrix.exe }} \
            tools/stvenc/stvenc.c src/codec/stv_dec.c -lm
      - name: Get ffmpeg
        run: |
          pip install imageio-ffmpeg pyinstaller
          python -c "import imageio_ffmpeg, shutil; shutil.copy(imageio_ffmpeg.get_ffmpeg_exe(), 'dist-bin/ffmpeg${{ matrix.exe }}')"
          chmod +x dist-bin/* || true
      - name: Smoke test
        run: |
          dist-bin/ffmpeg${{ matrix.exe }} -v error -y -f lavfi -i testsrc2=size=320x180:rate=24 \
            -f lavfi -i sine=frequency=440 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac smoke.mp4
          PATH="$PWD/dist-bin:$PATH" python converter/segatube_convert.py smoke.mp4 --out smoke-sd --modes full
          ls -la smoke-sd/MOVIES/*
      - name: Bundle
        run: |
          sep=":"
          if [ "${{ runner.os }}" = "Windows" ]; then sep=";"; fi
          pyinstaller --onefile --windowed --name SegaTubeConverter \
            --add-binary "dist-bin/stvenc${{ matrix.exe }}${sep}." \
            --add-binary "dist-bin/ffmpeg${{ matrix.exe }}${sep}." \
            converter/segatube_convert.py
      - name: Package
        # (artifact zips lose file permissions: ship archives that keep them)
        run: |
          mkdir -p out
          case "${{ runner.os }}" in
            Windows) cp dist/SegaTubeConverter.exe out/ ;;
            macOS)   ditto -c -k --keepParent dist/SegaTubeConverter.app out/SegaTubeConverter-mac.zip ;;
            Linux)   tar -C dist -czf out/SegaTubeConverter-linux.tar.gz SegaTubeConverter ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
      - name: Add to the latest release
        if: github.ref == 'refs/heads/main' && needs.release.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest out/* --clobber
